repos:
  - repo: https://github.com/berquist/pre-commit-rust
    rev: v2.1.1
    hooks:
      - id: cargo-fmt
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.5
    hooks:
      # Run the linter.
      - id: ruff
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format