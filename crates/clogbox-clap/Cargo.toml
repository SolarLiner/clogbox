[package]
name = "clogbox-clap"
version.workspace = true
rust-version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true

[dependencies]
clogbox-enum = { workspace = true, features = ["serialize"] }
clogbox-math.workspace = true
clogbox-module.workspace = true

clack-plugin.workspace = true
clack-extensions = { workspace = true, features = ["clack-plugin", "audio-ports", "params", "state", "note-ports"] }
env_logger = { workspace = true, optional = true }
log.workspace = true
ringbuf = { workspace = true, optional = true }
postcard = { version = "1.1.3", features = ["alloc", "use-std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true, optional = true }
num-traits.workspace = true

raw-window-handle = { version = "0.5.0", optional = true }

[dev-dependencies]
serde_json = "1.0.149"

[features]
default = ["log"]
gui = ["clack-extensions/gui", "clack-extensions/raw-window-handle_05", "dep:raw-window-handle", "dep:ringbuf", "dep:serde_json"]
log = ["dep:env_logger", "clack-extensions/log", "clack-extensions/timer", "log/std"]
